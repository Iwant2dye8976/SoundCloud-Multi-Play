<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundCloud Multi-Play</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M11.5 5.5a5 5 0 0 1 4.86 3.84A3.75 3.75 0 0 1 17.5 16.5H7.25a2.75 2.75 0 0 1-.25-5.49A5 5 0 0 1 11.5 5.5z"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>SoundCloud Multi-Play</h1>
          <div class="status-pill" id="status-card">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-text">Multi-play active</span>
          </div>
        </div>
      </div>

      <label class="switch" aria-label="Toggle SoundCloud Multi-Play">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="tabs-bar hidden" id="tabs-bar" role="tablist" aria-label="SoundCloud tabs"></div>

    <section class="player-card" id="player-card">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
          </svg>
        </div>
        <p id="empty-message">No SoundCloud playback detected.</p>
        <div class="resume-card hidden" id="resume-card">
          <div class="resume-meta">
            <span class="resume-label">Saved position</span>
            <span class="resume-title" id="resume-title">—</span>
            <span class="resume-time" id="resume-time">0:00 / 0:00</span>
          </div>
          <div class="resume-actions">
            <button type="button" class="btn-primary-sm" id="resume-btn">Resume</button>
            <button type="button" class="icon-btn subtle" id="clear-resume-btn" title="Clear saved progress" aria-label="Clear saved progress">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.3l6.3 6.29 6.29-6.3z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="button" class="btn-secondary" id="open-sc-btn">Open SoundCloud</button>
      </div>

      <div class="player-content hidden" id="player-content">
        <div class="track-row">
          <div class="artwork-frame">
            <img class="artwork" id="artwork" alt="Track artwork" />
            <div class="artwork-fallback" id="artwork-fallback" aria-hidden="true">♪</div>
          </div>

          <div class="track-meta">
            <div class="track-title" id="track-title" title="">
              <span class="track-title-marquee" id="track-title-marquee">
                <span class="track-title-text" id="track-title-text">—</span>
                <span class="track-title-clone" id="track-title-clone" aria-hidden="true"></span>
              </span>
            </div>
            <div class="track-artist" id="track-artist" title="">—</div>
          </div>

          <button
            type="button"
            class="icon-btn subtle"
            id="focus-tab-btn"
            title="Switch to SoundCloud tab"
            aria-label="Switch to SoundCloud tab"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/>
            </svg>
          </button>
        </div>

        <div class="progress-section">
          <input
            type="range"
            class="progress-range"
            id="progress-range"
            min="0"
            max="10000"
            value="0"
            aria-label="Track progress"
          />
          <div class="time-row">
            <span id="time-passed">0:00</span>
            <span id="time-duration">0:00</span>
          </div>
        </div>

        <div class="controls-row" role="group" aria-label="Playback controls">
          <button type="button" class="icon-btn" id="btn-shuffle" title="Shuffle (S)" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="btn-prev" title="Previous track (Shift + ←)" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>

          <button type="button" class="icon-btn skip-sec-btn" id="btn-back10" title="Rewind 10s (←)" aria-label="Rewind 10 seconds">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span class="skip-label">10</span>
          </button>

          <button type="button" class="play-btn" id="btn-play" title="Play / Pause (Space)" aria-label="Play or pause">
            <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button type="button" class="icon-btn skip-sec-btn" id="btn-fwd10" title="Forward 10s (→)" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            </svg>
            <span class="skip-label">10</span>
          </button>

          <button type="button" class="icon-btn" id="btn-next" title="Next track (Shift + →)" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="btn-repeat" title="Repeat (R)" aria-label="Repeat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
            </svg>
            <span class="repeat-badge hidden" id="repeat-badge">1</span>
          </button>
        </div>

        <div class="volume-row">
          <button type="button" class="icon-btn" id="btn-mute" title="Mute / Unmute (M)" aria-label="Mute or unmute">
            <svg id="icon-vol" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input
            type="range"
            class="volume-range"
            id="volume-range"
            min="0"
            max="100"
            value="100"
            aria-label="Volume"
          />
          <span class="volume-value" id="volume-value">100%</span>
        </div>

        <div class="social-row">
          <button type="button" class="social-btn" id="btn-like" title="Like track (L)" aria-label="Like track">
            <svg class="icon-heart-outline" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <svg class="icon-heart-solid hidden" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span id="like-text">Like</span>
          </button>

          <button type="button" class="social-btn" id="btn-follow" title="Follow artist (F)" aria-label="Follow artist">
            <svg class="icon-follow-add" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <svg class="icon-follow-check hidden" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 2.5L3.5 12 2 13.5 6 17.5l6.5-6.5L11 9.5 6 14.5zm9-.5c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span id="follow-text">Follow</span>
          </button>

          <button type="button" class="social-btn" id="btn-copy" title="Copy song link (C)" aria-label="Copy song link">
            <svg class="icon-copy-link" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
            </svg>
            <svg class="icon-copy-done hidden" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
            <span id="copy-text">Copy link</span>
          </button>
        </div>

        <button type="button" class="download-btn" id="btn-download" title="Download playing track (D)">
          <span class="download-fill" id="download-fill"></span>
          <span class="download-label" id="download-label">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path d="M5 20h14v-2H5v2zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1z"/>
            </svg>
            <span id="download-text">Download track</span>
          </span>
        </button>

        <div class="shortcuts-row" aria-hidden="true">
          <span><kbd>Space</kbd> Play</span>
          <span><kbd>←</kbd><kbd>→</kbd> Seek</span>
          <span><kbd>⇧</kbd><kbd>←</kbd><kbd>→</kbd> Track</span>
          <span><kbd>D</kbd> Save</span>
        </div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e10" />
  <title>SoundCloud Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M11.5 5.5a5 5 0 0 1 4.86 3.84A3.75 3.75 0 0 1 17.5 16.5H7.25a2.75 2.75 0 0 1-.25-5.49A5 5 0 0 1 11.5 5.5z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SoundCloud Remote</h1>
          <div class="conn-pill" id="conn-pill">
            <span class="conn-dot" id="conn-dot"></span>
            <span id="conn-text">Enter PIN to connect</span>
          </div>
        </div>
      </div>

      <button type="button" class="btn-ghost hidden" id="btn-disconnect">Unpair</button>
    </header>

    <!-- PIN Pairing View -->
    <section class="card pin-card" id="pin-view">
      <h2>Pair with PC</h2>
      <p class="hint">Enter the 6-digit PIN shown in the SoundCloud Multi-Play popup or terminal.</p>
      <form id="pin-form" class="pin-form">
        <input
          type="text"
          id="pin-input"
          class="pin-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="000000"
          aria-label="6-digit pairing PIN"
          required
        />
        <button type="submit" class="btn-accent" id="pin-submit">Connect</button>
      </form>
      <div class="pin-divider"><span>or</span></div>
      <button type="button" class="btn-secondary-full" id="btn-scan-qr">Scan QR Code</button>
      <input type="file" id="qr-file-input" accept="image/*" capture="environment" class="hidden" />
      <div class="qr-scanner hidden" id="qr-scanner">
        <video id="qr-video" class="qr-video" playsinline muted></video>
        <button type="button" class="btn-ghost" id="btn-scan-cancel">Cancel Scan</button>
      </div>
      <p class="pin-error hidden" id="pin-error">Invalid PIN or server unreachable.</p>
    </section>

    <!-- Remote Player View -->
    <section class="remote-view hidden" id="remote-view">
      <form class="play-url-form" id="play-url-form">
        <input
          type="url"
          id="play-url-input"
          class="play-url-input"
          placeholder="Paste SoundCloud link to play..."
          aria-label="SoundCloud link"
          required
        />
        <button type="submit" class="btn-accent play-url-btn" id="play-url-btn">Play</button>
      </form>
      <p class="play-url-error hidden" id="play-url-error">Enter a valid soundcloud.com link.</p>

      <div class="tabs-bar hidden" id="tabs-bar" role="tablist" aria-label="SoundCloud tabs"></div>

      <div class="card player-card">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
            </svg>
          </div>
          <p id="empty-message">Waiting for SoundCloud playback on PC...</p>
          <div class="resume-card hidden" id="resume-card">
            <div class="resume-meta">
              <span class="resume-label">Saved position</span>
              <span class="resume-title" id="resume-title">—</span>
              <span class="resume-time" id="resume-time">0:00 / 0:00</span>
            </div>
            <div class="resume-actions">
              <button type="button" class="btn-primary-sm" id="resume-btn">Resume</button>
              <button type="button" class="icon-btn" id="clear-resume-btn" aria-label="Clear saved progress">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                  <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.3l6.3 6.29 6.29-6.3z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="player-content hidden" id="player-content">
          <div class="artwork-wrap">
            <img class="artwork hidden" id="artwork" alt="Track artwork" />
            <div class="artwork-fallback" id="artwork-fallback" aria-hidden="true">♪</div>
          </div>

          <div class="track-info">
            <div class="track-title" id="track-title">—</div>
            <div class="track-artist" id="track-artist">—</div>
          </div>

          <div class="progress-section">
            <input
              type="range"
              class="progress-range"
              id="progress-range"
              min="0"
              max="10000"
              value="0"
              aria-label="Track progress"
            />
            <div class="time-row">
              <span id="time-passed">0:00</span>
              <span id="time-duration">0:00</span>
            </div>
          </div>

          <div class="controls-row" role="group" aria-label="Playback controls">
            <button type="button" class="icon-btn" id="btn-shuffle" aria-label="Shuffle">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
              </svg>
            </button>

            <button type="button" class="icon-btn" id="btn-prev" aria-label="Previous track">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
              </svg>
            </button>

            <button type="button" class="icon-btn skip-sec-btn" id="btn-back10" aria-label="Rewind 10 seconds">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              </svg>
              <span class="skip-label">10</span>
            </button>

            <button type="button" class="play-btn" id="btn-play" aria-label="Play or pause">
              <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <button type="button" class="icon-btn skip-sec-btn" id="btn-fwd10" aria-label="Forward 10 seconds">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
              </svg>
              <span class="skip-label">10</span>
            </button>

            <button type="button" class="icon-btn" id="btn-next" aria-label="Next track">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>

            <button type="button" class="icon-btn" id="btn-repeat" aria-label="Repeat">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
              </svg>
              <span class="repeat-badge hidden" id="repeat-badge">1</span>
            </button>
          </div>

          <div class="volume-row">
            <button type="button" class="icon-btn" id="btn-mute" aria-label="Mute or unmute">
              <svg id="icon-vol" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
            <input
              type="range"
              class="volume-range"
              id="volume-range"
              min="0"
              max="100"
              value="100"
              aria-label="Volume"
            />
            <span class="volume-value" id="volume-value">100%</span>
          </div>

          <div class="social-row">
            <button type="button" class="social-btn" id="btn-like" aria-label="Like track">
              <svg class="icon-heart-outline" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
              <svg class="icon-heart-solid hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
              <span id="like-text">Like</span>
            </button>

            <button type="button" class="social-btn" id="btn-follow" aria-label="Follow artist">
              <svg class="icon-follow-add" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <svg class="icon-follow-check hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 2.5L3.5 12 2 13.5 6 17.5l6.5-6.5L11 9.5 6 14.5zm9-.5c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span id="follow-text">Follow</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="qr-decode.js"></script>
  <script src="app.js"></script>
</body>
</html>
